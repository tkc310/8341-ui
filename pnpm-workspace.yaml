packages:
  - packages/*
  - apps/*

# バージョンはここで一元管理し、各 package.json からは "catalog:" で参照する
catalog:
  # 実行時
  react: ^19.3.1
  react-dom: ^19.3.1
  '@base-ui/react': ^1.9.0
  # 3.3 以降はクラス統合を内蔵（tailwind-merge は不要）
  tailwind-variants: ^3.3.1
  # スタイル
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tailwindcss/cli': ^4.3.3
  # トークン
  style-dictionary: ^5.7.0 # 5.7 で duration オブジェクトと $root に対応
  # ツールチェーン
  vite-plus: ^1.3.0
  typescript: ^7.0.2
  '@types/node': ^24.19.2
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^6.1.2
  '@changesets/cli': ^3.0.3
  dependency-cruiser: ^18.6.0
  # テスト
  happy-dom: ^21.0.3
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.1
  '@testing-library/jest-dom': ^7.0.1
  '@vitest/browser-playwright': ^5.0.5
  playwright: ^1.64.1
  '@playwright/test': ^1.64.1
  axe-core: ^4.10.3
  # ドキュメント
  storybook: ^10.6.2
  '@storybook/react-vite': ^10.6.2
  '@storybook/addon-docs': ^10.6.2
  '@storybook/addon-a11y': ^10.6.2
  '@storybook/addon-vitest': ^10.6.2
  # 配布（shadcn 方式のレジストリ）
  shadcn: ^4.21.0
  # Figma
  '@figma/code-connect': ^2.0.2

catalogMode: strict

# Vite+ が同梱する Vite / Vitest に揃える（@* 指定なので catalog: の参照は壊れない）
# - vite: Vite+ のコア（@voidzero-dev/vite-plus-core）に差し替える
# - vitest: vite-plus 1.3 が内部で固定している Vitest 5 の版に合わせる。Storybook の addon-vitest などが別の版を引き込むと
#   テストランナーが二重になるため。vite-plus を上げたら、この版も vite-plus の package.json に合わせて上げる
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@^1.3.0
  vitest@*: 5.0.5

# pnpm はビルドスクリプトを既定で拒否する。必要なものだけ許可する
# vite は Vite+ のコア（1.x）に差し替えているため、vite 6〜8 を要求する peer 指定を満たしたものとして扱う
peerDependencyRules:
  allowedVersions:
    vite: '1'
    vite-plus: '1'

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  playwright: false
  # Storybook 経由の監視用ネイティブ拡張。ビルドしなくても JS 実装で動く
  '@parcel/watcher': false

# 公開から 1 日経っていない版は入れない（サプライチェーン対策）
minimumReleaseAge: 1440
