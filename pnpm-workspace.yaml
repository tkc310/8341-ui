packages:
  - packages/*
  - apps/*

# バージョンはここで一元管理し、各 package.json からは "catalog:" で参照する
catalog:
  # 実行時
  react: ^19.2.0
  react-dom: ^19.2.0
  '@base-ui/react': ^1.9.0
  # 3.3 以降はクラス統合を内蔵（tailwind-merge は不要）
  tailwind-variants: ^3.3.0
  # スタイル
  tailwindcss: ^4.3.0
  '@tailwindcss/vite': ^4.3.0
  '@tailwindcss/cli': ^4.3.0
  # トークン
  style-dictionary: ^5.7.0   # 5.7 で duration オブジェクトと $root に対応
  # ツールチェーン
  vite-plus: ^1.3.0
  typescript: ^5.9.0
  '@types/node': ^22.18.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.0
  '@changesets/cli': ^3.0.3
  dependency-cruiser: ^18.6.0
  tsx: ^4.20.0
  # テスト
  happy-dom: ^20.0.0
  '@testing-library/react': ^16.3.0
  '@testing-library/user-event': ^14.6.1
  '@testing-library/jest-dom': ^6.8.0
  '@vitest/browser-playwright': ^5.0.5
  playwright: ^1.56.0
  '@playwright/test': ^1.56.0
  axe-core: ^4.10.3
  # ドキュメント
  storybook: ^10.6.1
  '@storybook/react-vite': ^10.6.1
  '@storybook/addon-docs': ^10.6.1
  '@storybook/addon-a11y': ^10.6.1
  '@storybook/addon-vitest': ^10.6.1
  # Figma
  '@figma/code-connect': ^1.3.0

catalogMode: strict

# Vite+ が同梱する Vite / Vitest に揃える（@* 指定なので catalog: の参照は壊れない）
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@^1.3.0
  vitest@*: 5.0.5

# pnpm 11 はビルドスクリプトを既定で拒否する。必要なものだけ許可する
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  playwright: false

# 公開から 1 日経っていない版は入れない（サプライチェーン対策。pnpm 11 の既定）
minimumReleaseAge: 1440
