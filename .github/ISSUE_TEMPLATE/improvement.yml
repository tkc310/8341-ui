name: 改善提案
description: 使っていて気づいた問題・改善のアイデア
title: '[改善] '
labels: [improvement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 種類
      description: 優先度はこの順（上ほど高い）で判断します
      options:
        - アクセシビリティの不具合（誰かが使えない）
        - 一貫性の破れ（同じものが違って見える）
        - 開発体験（API が使いにくい・部品が足りない）
        - 見た目の改善
    validations:
      required: true
  - type: dropdown
    id: principle
    attributes:
      label: 関係するルール
      description: 上流の design-principles のどこに関係するか（docs/rulebook/01-principles.md の対応表）
      options:
        - WCAG 2.2 の達成基準
        - 原則「読み順と優先度」「まとまり」「文字と図の判別」「配置の秩序」
        - 原則「操作の幾何」「一度に出す数」「一貫性」
        - 原則「状態と応答」「誤りと撤回」「再認」「文言」
        - 原則「削る」「助けの場所」「短い経路」「自律的な処理の範囲」
        - サービス別の特化ルール
        - 8341-ui の設計方針（トークン・API・仕組み）
        - 分からない
  - type: checkboxes
    id: upstream
    attributes:
      label: 上流のルール
      options:
        - label: 上流（design-principles）のルール自体にギャップや曖昧さがある（上流へも PR を出す）
  - type: input
    id: where
    attributes:
      label: 対象
      placeholder: 例) Button / color.text.subtle / ルールブック 03
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか・何に困ったか
      description: 再現手順、スクリーンショット、利用したプロジェクト
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 改善案（あれば）
  - type: textarea
    id: prevention
    attributes:
      label: 再発防止の案
      description: どのチェック・テスト・ルールを足せば同じ問題が起きなくなるか
