name: Storybook preview cleanup

# PR を閉じたら、ローカルから公開した Storybook のプレビュー（gh-pages の pr-preview/pr-<番号>/）を消す。
# 公開はローカルで行う（pnpm storybook:preview。手順は .claude/skills/ds-storybook-preview/SKILL.md）。
# ここではビルドしない。

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
        continue-on-error: true # gh-pages がまだ無ければ何もしない
      - name: プレビューを消す
        env:
          DIR: pr-preview/pr-${{ github.event.pull_request.number }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -d "$DIR" ]; then echo "プレビューはありません"; exit 0; fi
          git rm -rq "$DIR"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "preview: remove PR #$PR"
          for i in 1 2 3; do git push -q origin HEAD:gh-pages && exit 0; git pull -q --rebase origin gh-pages; done
          exit 1
