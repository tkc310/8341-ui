name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # pnpm-lock.yaml をコミットするまでは cache: pnpm を使えない（ロックファイルが必須）
      # pnpm-lock.yaml をコミットしたら --frozen-lockfile を付ける
      - run: pnpm install
      # 生成物の鮮度・コントラスト・DESIGN.md 同期・レジストリ・fmt・lint（型情報つき）・型検査・アーキテクチャ
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # pnpm-lock.yaml をコミットするまでは cache: pnpm を使えない（ロックファイルが必須）
      # pnpm-lock.yaml をコミットしたら --frozen-lockfile を付ける
      - run: pnpm install
      - run: pnpm --filter tkc310-ui-storybook exec playwright install --with-deps chromium
      # unit（happy-dom）+ storybook（全ストーリーを実ブラウザで描画し a11y 検査）
      # VRT と e2e は手動・都度実行のため CI では回さない
      - run: pnpm test

  release:
    if: github.ref == 'refs/heads/main'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # pnpm-lock.yaml をコミットするまでは cache: pnpm を使えない（ロックファイルが必須）
          registry-url: https://registry.npmjs.org
      # pnpm-lock.yaml をコミットしたら --frozen-lockfile を付ける
      - run: pnpm install
      # changeset があればバージョン更新 PR を作り、マージ後に公開する
      - uses: changesets/action@v2
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  storybook:
    if: github.ref == 'refs/heads/main'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # pnpm-lock.yaml をコミットするまでは cache: pnpm を使えない（ロックファイルが必須）
      # pnpm-lock.yaml をコミットしたら --frozen-lockfile を付ける
      - run: pnpm install
      # Storybook とレジストリ（/r/*.json）を同じ Pages に置く
      - run: pnpm build:storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storybook/storybook-static
      - uses: actions/deploy-pages@v4
