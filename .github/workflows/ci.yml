name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 生成物の鮮度・コントラスト・DESIGN.md 同期・レジストリ・fmt・lint（型情報つき）・型検査・アーキテクチャ
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter 8341-ui-storybook exec playwright install --with-deps chromium
      # unit（happy-dom）+ storybook（全ストーリーを実ブラウザで描画し a11y 検査）
      # VRT と e2e は手動・都度実行のため CI では回さない
      - run: pnpm test

  # リリース（手順と方針は docs/releasing.md）
  #   - changeset があれば「版を上げる PR」（Version Packages）を作る / 更新する
  #   - その PR がマージされると、タグ（8341-ui@x.y.z）と GitHub Releases を作り、その版のレジストリを r/v<版>/ に残す
  #   - npm への公開は、リポジトリ変数 ENABLE_NPM_PUBLISH が true のときだけ行う
  release:
    if: github.ref == 'refs/heads/main'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        id: changesets
        with:
          title: 'chore: リリース（Version Packages）'
          commit: 'chore: リリース（Version Packages）'
          # npm に公開しないときは、タグだけ作る（GitHub Releases は「New tag」の出力から作られる）
          publish: ${{ vars.ENABLE_NPM_PUBLISH == 'true' && 'pnpm release' || 'pnpm release:tag' }}
          createGithubReleases: true
        env:
          # CHANGESETS_TOKEN（任意）を登録すると、版を上げる PR でも CI が動く（GITHUB_TOKEN で作った PR では動かない）
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # shadcn の利用者が版を固定できるよう、リリースした版のレジストリを r/v<版>/ に残す
      - name: リリースした版のレジストリを作る
        id: snapshot
        if: steps.changesets.outputs.published == 'true'
        run: |
          pnpm build:tokens
          pnpm --filter 8341-ui registry:build
          echo "version=$(node -p "require('./packages/ui/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: JamesIves/github-pages-deploy-action@v4
        if: steps.changesets.outputs.published == 'true'
        with:
          folder: apps/storybook/public/r
          branch: gh-pages
          target-folder: r/v${{ steps.snapshot.outputs.version }}
          clean: false
          force: false

  # main の Storybook と最新のレジストリ（/r/*.json）を gh-pages ブランチの直下に置く。
  # PR のプレビュー（pr-preview/）と、リリースした版のレジストリ（r/v<版>/）は消さない。強制 push もしない
  storybook:
    if: github.ref == 'refs/heads/main'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:storybook
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/storybook/storybook-static
          branch: gh-pages
          clean-exclude: |
            pr-preview
            r/v*
          force: false
