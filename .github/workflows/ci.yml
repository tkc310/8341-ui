name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 道具の版は .tool-versions にそろえる
      - id: versions
        run: echo "pnpm=$(awk '$1=="pnpm"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 生成物の鮮度・コントラスト・DESIGN.md 同期・レジストリ・fmt・lint（型情報つき）・型検査・アーキテクチャ
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 道具の版は .tool-versions にそろえる
      - id: versions
        run: echo "pnpm=$(awk '$1=="pnpm"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter 8341-ui-storybook exec playwright install --with-deps chromium
      # unit（happy-dom）+ storybook（全ストーリーを実ブラウザで描画し a11y 検査）
      # VRT と e2e は手動・都度実行のため CI では回さない
      - run: pnpm test

  # リリースは CI では行わない。権限のあるアカウント保有者が手元で pnpm release:version / release:publish を実行する
  # （リポジトリにトークンやシークレットを置かない。docs/releasing.md・ADR-0014）

  # main の Storybook と最新のレジストリ（/r/*.json）を gh-pages ブランチの直下に置く。
  # PR のプレビュー（pr-preview/）と、リリースした版のレジストリ（r/v<版>/）は消さない。強制 push もしない
  storybook:
    if: github.ref == 'refs/heads/main'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # 道具の版は .tool-versions にそろえる
      - id: versions
        run: echo "pnpm=$(awk '$1=="pnpm"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:storybook
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/storybook/storybook-static
          branch: gh-pages
          clean-exclude: |
            pr-preview
            r/v*
          force: false
