# 一時的な検証用（マージ前に削除する）
name: ci-debug
on:
  push:
    branches: [feat/logo]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: versions
        run: echo "pnpm=$(awk '$1=="pnpm"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: make install-ci
      - run: make check > check.log 2>&1 || true
      - run: pnpm exec vp fmt >/dev/null 2>&1 || true; git diff > fmt.patch || true
      - run: |
          mkdir /tmp/out && cp check.log fmt.patch /tmp/out/
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan ci-debug && git rm -rqf . && cp /tmp/out/* . && git add check.log fmt.patch
          git commit -qm debug && git push -f origin ci-debug
